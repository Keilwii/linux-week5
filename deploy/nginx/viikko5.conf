# Week 5 chat at /viikko5/. Only location blocks, no server block:
# the existing site (sites-available/week-1) has one line
#     include snippets/viikko5.conf;
# and the deploy copies this file to /etc/nginx/snippets/viikko5.conf.
#
# ^~ stops nginx from trying regex locations for these paths.

location = /viikko5 {
    return 301 /viikko5/;
}

# static files straight from disk
location ^~ /viikko5/static/ {
    alias /opt/viikko5/app/static/;
    expires 1h;
}

location ^~ /viikko5/ {
    # the trailing / after the socket strips the prefix: /viikko5/api/chat -> /api/chat
    proxy_pass http://unix:/run/viikko5/gunicorn.sock:/;
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix /viikko5;

    client_max_body_size 64k;

    # the reply is streamed token by token, so no buffering
    proxy_buffering off;
    proxy_cache off;

    # the model runs on the CPU and can be slow
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
